<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>사진 시간 표시</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
    background: #f5f5f7; color: #1d1d1f;
    padding: 16px; max-width: 640px; margin: 0 auto;
  }
  h1 { font-size: 20px; margin-bottom: 4px; }
  .sub { font-size: 13px; color: #6e6e73; margin-bottom: 16px; }
  .btn {
    display: block; width: 100%; padding: 14px; border: none; border-radius: 12px;
    font-size: 16px; font-weight: 600; cursor: pointer; margin-bottom: 10px;
  }
  .btn-primary { background: #0071e3; color: #fff; }
  .btn-save { background: #34c759; color: #fff; }
  .btn:disabled { opacity: 0.4; }
  #status { font-size: 14px; color: #6e6e73; margin: 10px 0; min-height: 20px; }
  .grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 12px;
  }
  .cell { position: relative; border-radius: 8px; overflow: hidden; background: #ddd; aspect-ratio: 1; }
  .cell img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .badge {
    position: absolute; top: 4px; left: 4px; background: rgba(255,149,0,0.92);
    color: #fff; font-size: 10px; padding: 2px 5px; border-radius: 5px;
  }
  .cell a.dl {
    position: absolute; bottom: 4px; right: 4px; background: rgba(0,0,0,0.55);
    color: #fff; font-size: 11px; padding: 3px 7px; border-radius: 6px; text-decoration: none;
  }
  .notice { font-size: 12px; color: #b25000; margin-top: 10px; display: none; }
  input[type=file] { display: none; }
</style>
</head>
<body>
  <h1>사진 시간 표시</h1>
  <p class="sub">사진을 선택하면 촬영 시간을 우하단에 새겨 줍니다. 사진은 서버로 전송되지 않습니다. (최대 50장)</p>

  <input type="file" id="fileInput" multiple accept="image/*">
  <button class="btn btn-primary" id="pickBtn">사진 선택</button>
  <button class="btn btn-save" id="saveBtn" disabled>앨범에 저장</button>
  <div id="status"></div>
  <p class="notice" id="notice">⚠ 표시된 사진은 촬영 정보(EXIF)가 없어 파일 시각을 대신 사용했습니다.</p>
  <div class="grid" id="grid"></div>

<script src="https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/lite.umd.js"></script>
<script>
const fileInput = document.getElementById('fileInput');
const pickBtn = document.getElementById('pickBtn');
const saveBtn = document.getElementById('saveBtn');
const statusEl = document.getElementById('status');
const grid = document.getElementById('grid');
const notice = document.getElementById('notice');

let results = []; // { file: File, fallback: boolean }

pickBtn.onclick = () => fileInput.click();

fileInput.onchange = async () => {
  let files = Array.from(fileInput.files);
  if (files.length === 0) return;
  if (files.length > 50) {
    files = files.slice(0, 50);
    alert('최대 50장까지만 처리합니다. 앞의 50장만 사용합니다.');
  }
  results = [];
  grid.innerHTML = '';
  notice.style.display = 'none';
  saveBtn.disabled = true;
  pickBtn.disabled = true;

  let hasFallback = false;
  for (let i = 0; i < files.length; i++) {
    statusEl.textContent = `처리 중... ${i + 1} / ${files.length}`;
    try {
      const r = await processOne(files[i]);
      results.push(r);
      if (r.fallback) hasFallback = true;
      addThumb(r);
    } catch (e) {
      console.error(files[i].name, e);
      statusEl.textContent = `${files[i].name} 처리 실패 (지원하지 않는 형식일 수 있습니다)`;
      await new Promise(res => setTimeout(res, 800));
    }
  }

  statusEl.textContent = `완료: ${results.length}장`;
  if (hasFallback) notice.style.display = 'block';
  saveBtn.disabled = results.length === 0;
  pickBtn.disabled = false;
  fileInput.value = '';
};

async function processOne(file) {
  // 1. 촬영 시간 읽기 (없으면 파일 시각으로 대체)
  let date = null, fallback = false;
  try {
    const exif = await exifr.parse(file, ['DateTimeOriginal', 'CreateDate']);
    date = exif && (exif.DateTimeOriginal || exif.CreateDate) || null;
  } catch (e) { /* EXIF 파싱 실패 → 대체 */ }
  if (!(date instanceof Date) || isNaN(date)) {
    date = new Date(file.lastModified);
    fallback = true;
  }
  const text = fmt(date);

  // 2. 캔버스에 그리기
  const bitmap = await loadImage(file);
  const canvas = document.createElement('canvas');
  canvas.width = bitmap.width;
  canvas.height = bitmap.height;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(bitmap, 0, 0);
  if (bitmap.close) bitmap.close();

  // 3. 우하단 밝기를 재서 검정/흰색 선택
  const fontSize = Math.max(20, Math.round(canvas.width * 0.055));
  const pad = Math.round(fontSize * 0.8);
  ctx.font = `600 ${fontSize}px -apple-system, "Segoe UI", sans-serif`;
  const tw = ctx.measureText(text).width;
  const sx = Math.max(0, canvas.width - tw - pad * 2);
  const sy = Math.max(0, canvas.height - fontSize - pad * 2);
  const sample = ctx.getImageData(sx, sy, canvas.width - sx, canvas.height - sy).data;
  let lum = 0, n = 0;
  for (let i = 0; i < sample.length; i += 16) { // 4픽셀 간격 샘플링
    lum += 0.299 * sample[i] + 0.587 * sample[i + 1] + 0.114 * sample[i + 2];
    n++;
  }
  const bright = (lum / n) > 128;

  // 4. 텍스트 그리기 (부드러운 그림자로 가독성 확보)
  ctx.fillStyle = bright ? '#000000' : '#ffffff';
  ctx.shadowColor = bright ? 'rgba(255,255,255,0.7)' : 'rgba(0,0,0,0.7)';
  ctx.shadowBlur = fontSize * 0.25;
  ctx.textAlign = 'right';
  ctx.textBaseline = 'bottom';
  ctx.fillText(text, canvas.width - pad, canvas.height - pad);

  // 5. JPEG로 내보내기
  const blob = await new Promise(res => canvas.toBlob(res, 'image/jpeg', 0.92));
  const base = file.name.replace(/\.[^.]+$/, '');
  const out = new File([blob], `${base}_time.jpg`, { type: 'image/jpeg' });
  return { file: out, fallback };
}

function loadImage(file) {
  if (window.createImageBitmap) {
    return createImageBitmap(file).catch(() => loadImageTag(file));
  }
  return loadImageTag(file);
}

function loadImageTag(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); res(img); };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('이미지 로드 실패')); };
    img.src = url;
  });
}

function fmt(d) {
  const p = x => String(x).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

function addThumb(r) {
  const cell = document.createElement('div');
  cell.className = 'cell';
  const img = document.createElement('img');
  img.src = URL.createObjectURL(r.file);
  cell.appendChild(img);
  if (r.fallback) {
    const b = document.createElement('span');
    b.className = 'badge';
    b.textContent = '⚠ 파일 시각';
    cell.appendChild(b);
  }
  const a = document.createElement('a');
  a.className = 'dl';
  a.textContent = '저장';
  a.href = img.src;
  a.download = r.file.name;
  cell.appendChild(a);
  grid.appendChild(cell);
}

saveBtn.onclick = async () => {
  const files = results.map(r => r.file);
  if (navigator.canShare && navigator.canShare({ files })) {
    try {
      await navigator.share({ files });
      statusEl.textContent = '저장 완료! (공유 시트에서 "이미지 저장"을 눌렀다면 앨범에 있습니다)';
      return;
    } catch (e) {
      if (e.name === 'AbortError') return; // 사용자가 취소
      // 파일이 너무 많아 실패한 경우 → 10장씩 나눠서 시도
      try {
        for (let i = 0; i < files.length; i += 10) {
          await navigator.share({ files: files.slice(i, i + 10) });
        }
        statusEl.textContent = '저장 완료!';
        return;
      } catch (e2) {
        if (e2.name === 'AbortError') return;
      }
    }
  }
  // 공유 미지원(PC 등) → 개별 다운로드
  for (const f of files) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(f);
    a.download = f.name;
    a.click();
    await new Promise(res => setTimeout(res, 300));
  }
  statusEl.textContent = '다운로드 폴더에 저장했습니다.';
};
</script>
</body>
</html>
