<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>사진 시간 새기기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #faf6ef;
    --paper-deep: #f2ecdf;
    --ink: #262220;
    --ink-soft: #7a726a;
    --red: #c73e3a;
    --red-deep: #a92f2c;
    --stamp: #ff7a1a;
    --line: #e4dcce;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: "IBM Plex Sans KR", -apple-system, "Malgun Gothic", sans-serif;
    background:
      radial-gradient(circle at 85% -10%, #fdf3df 0%, transparent 45%),
      var(--paper);
    color: var(--ink);
    min-height: 100vh;
    padding: 28px 20px 48px;
    max-width: 560px;
    margin: 0 auto;
  }

  /* ── 헤더 ── */
  .eyebrow {
    display: flex; align-items: center; gap: 8px;
    font-size: 11px; font-weight: 600; letter-spacing: 0.22em;
    color: var(--red); text-transform: uppercase;
    animation: rise 0.6s ease both;
  }
  .eyebrow::before {
    content: ""; width: 22px; height: 1.5px; background: var(--red);
  }
  h1 {
    font-family: "Gowun Batang", serif;
    font-size: 34px; font-weight: 700; line-height: 1.25;
    margin: 12px 0 6px;
    animation: rise 0.6s 0.08s ease both;
  }
  h1 em { font-style: normal; color: var(--red); }
  .sub {
    font-size: 14px; color: var(--ink-soft); line-height: 1.65;
    animation: rise 0.6s 0.16s ease both;
  }

  /* ── 필름 날짜 스탬프 장식 ── */
  .stamp-demo {
    margin: 22px 0 26px;
    background: #1c1917;
    border-radius: 14px;
    padding: 26px 22px 14px;
    position: relative;
    overflow: hidden;
    animation: rise 0.6s 0.24s ease both;
  }
  .stamp-demo::before {
    content: "";
    position: absolute; inset: 0;
    background: radial-gradient(circle at 30% 20%, rgba(255,255,255,0.07), transparent 55%);
  }
  .stamp-demo .label {
    font-size: 10px; letter-spacing: 0.2em; color: #8a827a;
    text-transform: uppercase;
  }
  .stamp-demo .digits {
    font-family: "Share Tech Mono", "IBM Plex Sans KR", monospace;
    font-size: 22px; line-height: 1.4;
    color: var(--stamp);
    text-shadow: 0 0 10px rgba(255,122,26,0.55), 0 0 2px rgba(255,140,50,0.9);
    text-align: right;
    margin-top: 14px;
  }
  .stamp-demo .perf {
    position: absolute; top: 0; left: 0; right: 0; height: 8px;
    background: repeating-linear-gradient(90deg,
      transparent 0 10px, rgba(250,246,239,0.16) 10px 16px);
  }

  /* ── 버튼 ── */
  .btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; padding: 16px; border: none; border-radius: 13px;
    font-family: inherit; font-size: 16px; font-weight: 600; cursor: pointer;
    margin-bottom: 10px;
    transition: transform 0.12s ease, box-shadow 0.12s ease, opacity 0.2s;
  }
  .btn:active { transform: scale(0.975); }
  .btn-pick {
    background: transparent; color: var(--ink);
    border: 1.5px dashed #c9bfae;
    animation: rise 0.6s 0.32s ease both;
  }
  .btn-pick:active { background: var(--paper-deep); }
  .btn-save {
    background: var(--red); color: #fff;
    box-shadow: 0 6px 18px -6px rgba(199,62,58,0.5);
    animation: rise 0.6s 0.38s ease both;
  }
  .btn-save:active { background: var(--red-deep); }
  .btn:disabled { opacity: 0.35; pointer-events: none; }

  /* ── 상태 · 안내 ── */
  #status {
    font-size: 13.5px; color: var(--ink-soft); min-height: 20px;
    margin: 8px 2px 0; letter-spacing: 0.01em;
  }
  #status.done { color: var(--red); font-weight: 600; }
  .notice {
    display: none; margin-top: 12px; padding: 10px 13px;
    font-size: 12.5px; line-height: 1.55; color: #8a5a18;
    background: #fbf1dc; border-left: 3px solid #e0a13c; border-radius: 0 9px 9px 0;
  }

  /* ── 썸네일 그리드 ── */
  .grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px;
    margin-top: 18px;
  }
  .cell {
    position: relative; border-radius: 10px; overflow: hidden;
    background: var(--paper-deep); aspect-ratio: 1;
    border: 1px solid var(--line);
    animation: pop 0.4s ease both;
  }
  .cell img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .badge {
    position: absolute; top: 5px; left: 5px;
    background: rgba(224,161,60,0.95); color: #fff;
    font-size: 10px; font-weight: 600; padding: 2px 6px; border-radius: 5px;
  }
  .cell a.dl {
    position: absolute; bottom: 5px; right: 5px;
    background: rgba(28,25,23,0.62); backdrop-filter: blur(3px);
    color: #fff; font-size: 11px; font-weight: 500;
    padding: 4px 9px; border-radius: 7px; text-decoration: none;
  }
  .cell button.del {
    position: absolute; top: 5px; right: 5px; width: 26px; height: 26px;
    border: none; border-radius: 50%; cursor: pointer;
    background: rgba(28,25,23,0.62); backdrop-filter: blur(3px);
    color: #fff; font-size: 14px; line-height: 1; padding: 0;
  }

  /* ── 모달 ── */
  .modal {
    display: none; position: fixed; inset: 0; z-index: 50;
    background: rgba(20,17,15,0.93);
    align-items: center; justify-content: center; padding: 18px;
  }
  .modal.open { display: flex; }
  .modal img {
    max-width: 100%; max-height: 86vh; border-radius: 10px;
    animation: pop 0.22s ease both;
  }
  .modal .close {
    position: absolute; top: 12px; right: 16px;
    background: none; border: none; color: #fff;
    font-size: 32px; line-height: 1; cursor: pointer;
  }

  footer {
    margin-top: 34px; padding-top: 16px; border-top: 1px solid var(--line);
    font-size: 12px; color: #a89e92; text-align: center; line-height: 1.7;
  }

  input[type=file] { display: none; }

  @keyframes rise {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: none; }
  }
  @keyframes pop {
    from { opacity: 0; transform: scale(0.94); }
    to   { opacity: 1; transform: none; }
  }
</style>
</head>
<body>
  <p class="eyebrow">Film Date Stamp</p>
  <h1>사진에 <em>시간</em>을 새기다</h1>
  <p class="sub">촬영 시간을 읽어 사진 우하단에 새겨 드립니다.<br>사진은 기기 밖으로 나가지 않습니다. 최대 50장.</p>

  <div class="stamp-demo">
    <span class="perf"></span>
    <p class="label">Preview</p>
    <p class="digits" id="demoDigits">2026-09-01 14:32</p>
  </div>

  <input type="file" id="fileInput" multiple accept="image/*,image/heic,image/heif">
  <button class="btn btn-pick" id="pickBtn">📷&ensp;사진 선택하기</button>
  <button class="btn btn-save" id="saveBtn" disabled>앨범에 저장</button>
  <div id="status"></div>
  <p class="notice" id="notice">표시된 사진은 촬영 정보(EXIF)가 없어 <b>파일 시각</b>을 대신 사용했습니다.</p>
  <div class="grid" id="grid"></div>

  <footer>모든 처리는 이 브라우저 안에서만 이루어집니다.<br>서버 저장 · 전송 없음</footer>

  <div class="modal" id="modal">
    <button class="close" aria-label="닫기">×</button>
    <img id="modalImg" alt="미리보기">
  </div>

<script src="https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/full.umd.js"></script>
<script>
const fileInput = document.getElementById('fileInput');
const pickBtn = document.getElementById('pickBtn');
const saveBtn = document.getElementById('saveBtn');
const statusEl = document.getElementById('status');
const grid = document.getElementById('grid');
const notice = document.getElementById('notice');

document.getElementById('demoDigits').innerHTML = fmtLines(new Date()).join('<br>');

let results = []; // { file: File, fallback: boolean }

pickBtn.onclick = () => fileInput.click();

fileInput.onchange = async () => {
  let files = Array.from(fileInput.files);
  if (files.length === 0) return;
  if (files.length > 50) {
    files = files.slice(0, 50);
    alert('최대 50장까지만 처리합니다. 앞의 50장만 사용합니다.');
  }
  results = [];
  grid.innerHTML = '';
  notice.style.display = 'none';
  saveBtn.disabled = true;
  pickBtn.disabled = true;
  statusEl.classList.remove('done');

  // 4장씩 동시 처리
  let hasFallback = false, done = 0;
  const failed = [];
  const queue = files.slice();
  statusEl.textContent = `처리 중... 0 / ${files.length}`;
  const worker = async () => {
    while (queue.length) {
      const f = queue.shift();
      try {
        const r = await processOne(f);
        results.push(r);
        if (r.fallback) hasFallback = true;
        addThumb(r);
      } catch (e) {
        console.error(f.name, e);
        failed.push(f.name);
      }
      done++;
      statusEl.textContent = `처리 중... ${done} / ${files.length}`;
    }
  };
  await Promise.all(Array.from({ length: Math.min(4, files.length) }, worker));

  statusEl.textContent = `완료 · ${results.length}장` +
    (failed.length ? ` (실패 ${failed.length}장: ${failed.join(', ')})` : '');
  statusEl.classList.add('done');
  if (hasFallback) notice.style.display = 'block';
  saveBtn.disabled = results.length === 0;
  pickBtn.disabled = false;
  fileInput.value = '';
};

async function readDate(file) {
  try {
    const exif = await exifr.parse(file, ['DateTimeOriginal', 'CreateDate']);
    return exif && (exif.DateTimeOriginal || exif.CreateDate) || null;
  } catch (e) { return null; }
}

async function processOne(file) {
  // 1. EXIF 읽기와 이미지 디코딩을 동시에
  let [date, bitmap] = await Promise.all([readDate(file), loadImage(file)]);
  let fallback = false;
  if (!(date instanceof Date) || isNaN(date)) {
    date = new Date(file.lastModified);
    fallback = true;
  }
  const lines = fmtLines(date);

  // 2. 캔버스에 그리기
  const canvas = document.createElement('canvas');
  canvas.width = bitmap.width;
  canvas.height = bitmap.height;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(bitmap, 0, 0);
  if (bitmap.close) bitmap.close();

  // 3. 좌하단 밝기를 재서 검정/흰색 선택
  const fontSize = Math.max(20, Math.round(canvas.width * 0.045));
  const lineHeight = Math.round(fontSize * 1.35);
  const pad = Math.round(canvas.width * 0.055);
  ctx.font = `700 ${fontSize}px -apple-system, "Malgun Gothic", "Segoe UI", sans-serif`;
  const tw = Math.max(ctx.measureText(lines[0]).width, ctx.measureText(lines[1]).width);
  const sw = Math.min(canvas.width, tw + pad * 2);
  const sh = Math.min(canvas.height, lineHeight * 2 + pad * 2);
  const sy = canvas.height - sh;
  const sample = ctx.getImageData(0, sy, sw, sh).data;
  let lum = 0, n = 0;
  for (let i = 0; i < sample.length; i += 16) { // 4픽셀 간격 샘플링
    lum += 0.299 * sample[i] + 0.587 * sample[i + 1] + 0.114 * sample[i + 2];
    n++;
  }
  const bright = (lum / n) > 128;

  // 4. 텍스트 그리기 (부드러운 그림자로 가독성 확보)
  ctx.fillStyle = bright ? '#000000' : '#ffffff';
  ctx.shadowColor = bright ? 'rgba(255,255,255,0.6)' : 'rgba(0,0,0,0.6)';
  ctx.shadowBlur = fontSize * 0.2;
  ctx.shadowOffsetY = fontSize * 0.04;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'bottom';
  ctx.fillText(lines[0], pad, canvas.height - pad - lineHeight);
  ctx.fillText(lines[1], pad, canvas.height - pad);

  // 5. JPEG로 내보내기
  const blob = await new Promise(res => canvas.toBlob(res, 'image/jpeg', 0.92));
  const base = file.name.replace(/\.[^.]+$/, '');
  const out = new File([blob], `${base}_time.jpg`, { type: 'image/jpeg' });
  return { file: out, fallback };
}

function loadImage(file) {
  if (window.createImageBitmap) {
    return createImageBitmap(file).catch(() => loadImageTag(file));
  }
  return loadImageTag(file);
}

function loadImageTag(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); res(img); };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('이미지 로드 실패')); };
    img.src = url;
  });
}

function fmtLines(d) {
  const days = ['일', '월', '화', '수', '목', '금', '토'];
  const h = d.getHours();
  const ampm = h < 12 ? '오전' : '오후';
  const h12 = h % 12 === 0 ? 12 : h % 12;
  const mm = String(d.getMinutes()).padStart(2, '0');
  return [
    `${d.getFullYear()}년 ${d.getMonth() + 1}월 ${d.getDate()}일 (${days[d.getDay()]})`,
    `${ampm} ${h12}:${mm}`
  ];
}

function addThumb(r) {
  const cell = document.createElement('div');
  cell.className = 'cell';
  r.url = URL.createObjectURL(r.file);
  const img = document.createElement('img');
  img.src = r.url;
  img.onclick = () => openModal(r);
  cell.appendChild(img);
  if (r.fallback) {
    const b = document.createElement('span');
    b.className = 'badge';
    b.textContent = '파일 시각';
    cell.appendChild(b);
  }
  const del = document.createElement('button');
  del.className = 'del';
  del.textContent = '×';
  del.setAttribute('aria-label', '삭제');
  del.onclick = () => {
    results = results.filter(x => x !== r);
    URL.revokeObjectURL(r.url);
    cell.remove();
    saveBtn.disabled = results.length === 0;
    statusEl.textContent = `${results.length}장 준비됨`;
  };
  cell.appendChild(del);
  const a = document.createElement('a');
  a.className = 'dl';
  a.textContent = '저장';
  a.href = r.url;
  a.download = r.file.name;
  cell.appendChild(a);
  grid.appendChild(cell);
}

const modal = document.getElementById('modal');
const modalImg = document.getElementById('modalImg');
function openModal(r) {
  modalImg.src = r.url;
  modal.classList.add('open');
}
modal.onclick = () => modal.classList.remove('open');

saveBtn.onclick = async () => {
  const files = results.map(r => r.file);
  if (navigator.canShare && navigator.canShare({ files })) {
    try {
      await navigator.share({ files });
      statusEl.textContent = '저장 완료! (공유 시트에서 "이미지 저장"을 눌렀다면 앨범에 있습니다)';
      return;
    } catch (e) {
      if (e.name === 'AbortError') return; // 사용자가 취소
      // 파일이 너무 많아 실패한 경우 → 10장씩 나눠서 시도
      try {
        for (let i = 0; i < files.length; i += 10) {
          await navigator.share({ files: files.slice(i, i + 10) });
        }
        statusEl.textContent = '저장 완료!';
        return;
      } catch (e2) {
        if (e2.name === 'AbortError') return;
      }
    }
  }
  // 공유 미지원(PC 등) → 개별 다운로드
  for (const f of files) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(f);
    a.download = f.name;
    a.click();
    await new Promise(res => setTimeout(res, 300));
  }
  statusEl.textContent = '다운로드 폴더에 저장했습니다.';
};
</script>
</body>
</html>
